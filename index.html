<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8dc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="wiserest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>wiserest</title>
<link id="fl" rel="stylesheet">
<style>
:root{--c:#f2b632;--bg:#ffffff;--line:#f1e4b8;--soft:#fff6d6}
*{box-sizing:border-box}
body{margin:0;font-family:'Jua',sans-serif;background:var(--bg);color:#4a4030;padding-bottom:76px}
header{background:#fff8dc;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;color:#5a4a20;border-radius:0 0 24px 24px;box-shadow:0 2px 6px #0000000d}
#ch{width:64px;height:64px;flex:none;background:#fff;border-radius:50%;overflow:hidden;display:flex;border:3px solid #fff}
#ch svg,#ch img{width:100%;height:100%;object-fit:cover}
#ti{font-size:22px;margin:0}
#bub{background:#fff;color:#4a4030;border-radius:12px;padding:4px 10px;font-size:13px;margin-top:4px;display:inline-block}
main{padding:14px}
.card{background:#fff;border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px #00000014;border:1px solid #f3eee0}
input,select,textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px;margin:4px 0;background:#fff}
button{font:inherit;border:0;border-radius:12px;padding:9px 12px;background:var(--c);color:#fff;margin:3px 3px 3px 0}
button.g{background:#f1efe8;color:#555}
button:disabled,select:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{display:flex;gap:10px}
.it img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.done .nm{text-decoration:line-through;opacity:.5}
.nm{font-size:18px}.sm{font-size:13px;opacity:.8;white-space:pre-wrap}
.chip{display:inline-block;background:var(--soft);border-radius:20px;padding:3px 10px;margin:2px;font-size:13px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:#999;margin:0;border-radius:0;padding:12px 0;font-size:15px}
nav button.on{color:var(--c)}
#pl,#pl iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.big{font-size:30px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fold{background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 10px #00000014;border:1px solid #f3eee0;cursor:pointer;text-align:center}
.fold .th{width:100%;aspect-ratio:1;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin-bottom:6px}
.fold .th img{width:100%;height:100%;object-fit:cover}
.fold b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-box{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fffdf3}
.photo-box img{max-width:100%;max-height:180px;border-radius:12px;display:block;margin:0 auto}
input[type=color]{height:46px;padding:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#4a4030;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center;z-index:20}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal .card{max-width:320px;width:100%;text-align:center}
#mq{white-space:pre-line}
#foot{margin-top:24px;border-top:3px dashed var(--line)}#foot .row button{flex:1}
.total{background:var(--soft);text-align:center}.tsum{font-size:28px;color:#5a4a20;margin:2px 0}
.price{font-size:16px;color:var(--c);cursor:pointer;margin:2px 0}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:420px;overflow:auto;padding:2px}
.fo{border:2px solid #eee;border-radius:14px;padding:8px;text-align:center;cursor:pointer;background:#fff}
.fo.on{border-color:var(--c);background:var(--soft)}
.fo .s{font-size:22px;line-height:1.3}.fo .n{font-family:sans-serif;font-size:11px;color:#888}
</style></head><body>
<header><div id="ch"></div><div><h1 id="ti"></h1><span id="bub"></span></div></header>
<main><div id="v"></div>
<div class="card" id="inst" style="display:none;text-align:center"><b>📲 wiserest를 휴대폰에 설치하세요</b><p class="sm" id="insttx">홈 화면에 아이콘이 생기고, 인터넷이 없어도 열려요.</p><button id="instb" style="width:100%">앱 설치하기</button></div>
<div class="card" id="foot"><b>💾 데이터 관리</b><p class="sm">백업 파일(wiserest.json)에는 위시리스트·사진·노래·꾸미기가 모두 들어가요. AI 키는 안전을 위해 빼고 저장해요.</p>
<div class="row"><button id="bkup">📤 백업</button><button id="rstr">📥 복구</button><button class="g" id="rset">🧹 초기화</button></div></div></main>
<nav><button data-t="w">🎁 위시</button><button data-t="s">🎵 노래연습</button><button data-t="d">🎨 꾸미기</button></nav>
<div id="toast"></div>
<div id="modal"><div class="card"><p id="mq" style="font-size:17px"></p><input id="mi" inputmode="numeric" style="display:none;text-align:center;font-size:20px"><button id="my">네</button><button class="g" id="mn">아니요</button></div></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---- 저장 (v2: 리스트 여러 개) ----
const KEY='wish_v2';
const DEF_CFG={title:'wiserest',font:'Jua',color:'#f2b632',char:0,img:'',say:'사고 싶은 거 다 적어봐!',key:''};
function load(){
  try{
    const v2=JSON.parse(localStorage.getItem(KEY)||'null');if(v2)return v2;
    const v1=JSON.parse(localStorage.getItem('wish_v1')||'null');
    if(v1){ // 예전 데이터 옮기기: 기존 항목은 "내 위시리스트"로, 색은 새 노랑 테마로
      return {lists:[{id:uid(),title:'내 위시리스트',items:v1.items||[]}],songs:v1.songs||[],cfg:{...DEF_CFG,...v1.cfg,color:DEF_CFG.color}}}
  }catch(x){}
  return {lists:[],songs:[],cfg:{...DEF_CFG}}}
let S=load();
// 예전 "가격/메모" 칸에 숫자만 적었던 항목은 가격으로 옮겨주기
function migrate(){S.lists.forEach(l=>l.items.forEach(i=>{if(i.price===undefined){i.price=0;const m=String(i.memo||'').trim();if(/^[0-9,\s]+(원)?$/.test(m)){const d=+m.replace(/[^0-9]/g,'');if(d){i.price=d;i.memo=''}}}}));}
migrate();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){toast('저장 공간이 가득 찼어요. 사진을 몇 개 지워주세요.')}};

// ---- 알림/확인창 (페이지 안에서 직접 그림) ----
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function ask(q,val){return new Promise(res=>{$('#mq').textContent=q;$('#modal').style.display='flex';const inp=val!==undefined,mi=$('#mi');
  mi.style.display=inp?'block':'none';if(inp){mi.value=val?won(val):'';mi.oninput=()=>{const n=num(mi.value);mi.value=n?won(n):''};setTimeout(()=>mi.focus(),50)}
  $('#my').textContent=inp?'저장':'네';$('#mn').textContent=inp?'취소':'아니요';
  $('#my').onclick=()=>{$('#modal').style.display='none';res(inp?num(mi.value):true)};$('#mn').onclick=()=>{$('#modal').style.display='none';res(inp?null:false)}})}
// ---- 가격 도우미 ----
const num=s=>{const d=String(s??'').replace(/[^0-9]/g,'');return d?Math.min(+d,999999999999):0};
const won=n=>(+n||0).toLocaleString('ko-KR');
const sumOf=items=>items.reduce((a,i)=>{const p=+i.price||0;a.all+=p;if(i.done)a.done+=p;else a.left+=p;return a},{all:0,done:0,left:0});

let tab='w',cur=null,photo='',player=null,recOn=false,rec,heard='',A=0,B=0,loopOn=false,lt,song=-1;

// ---- 기본 캐릭터: 강아지 사진 (꾸미기에서 내 사진으로 바꿀 수 있음) ----

const fam=spec=>spec.split(':')[0];
const fUrl=(specs,text)=>'https://fonts.googleapis.com/css2?'+specs.map(f=>'family='+f.replace(/ /g,'+')).join('&')+(text?'&text='+encodeURIComponent(text):'')+'&display=swap';
const SAMPLE='가나다 위시 강아지 ABC 123';
function useFont(name){const sp=(FONTS.find(f=>fam(f[0])===name)||FONTS[0])[0];$('#fl').href=fUrl([sp])}

function skin(){const c=S.cfg;document.documentElement.style.setProperty('--c',c.color);useFont(c.font);document.body.style.fontFamily=`'${c.font}',sans-serif`;$('#ti').textContent=c.title;$('#bub').textContent=c.say;$('#ch').innerHTML=face()}

function shrink(file,cb,m=640){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.onerror=()=>toast('이 사진은 열 수 없어요');im.src=r.result};r.readAsDataURL(file)}
function pick(cb,m){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(f)shrink(f,cb,m)};i.click()}

// ---- AI (본인 API 키 필요) ----
async function ai(content){
  if(!S.cfg.key){toast('🎨 꾸미기 탭 맨 아래에 AI 키를 먼저 넣어주세요.');return null}
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:400,messages:[{role:'user',content}]})});
    const j=await r.json();if(!r.ok)return 'AI 오류: '+(j.error?.message||r.status);return j.content.map(x=>x.text||'').join('')}
  catch(x){return 'AI 호출 실패: '+x.message}}
const img64=d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.split(',')[1]}});

// ---- 화면 ----
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));skin();({w:rW,s:rS,d:rD})[tab]();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;song=-1;stopAll();render()});
const L=()=>S.lists.find(x=>x.id===cur);

// ---- 위시: 리스트(파일) 목록 ----
function rW(){if(L())return rItems();cur=null;
  $('#v').innerHTML=`<div class="card"><div class="big">📁</div>
  <b>새 위시리스트 만들기</b><input id="lt" placeholder="리스트 제목 (예: 생일선물, 문구류, 겨울옷)">
  <button id="la" style="width:100%">＋ 리스트 만들기</button></div>
  ${S.lists.length?(()=>{const t=sumOf(S.lists.flatMap(l=>l.items));return `<div class="card total"><b>💰 모든 리스트 합계</b><div class="tsum">${won(t.all)}원</div><div class="sm">✅ 산 것 ${won(t.done)}원 · 🛒 아직 안 산 것 ${won(t.left)}원</div></div>`})():''}
  ${S.lists.length?`<div class="grid">${S.lists.map(l=>{const ph=l.items.find(i=>i.photo),dn=l.items.filter(i=>i.done).length;
    return `<div class="fold" onclick="openList('${l.id}')"><div class="th">${ph?`<img src="${ph.photo}">`:'🎁'}</div><b>${e(l.title)}</b><span class="sm">${l.items.length}개 · 산 것 ${dn}개</span><div style="color:var(--c);font-size:15px">${won(sumOf(l.items).all)}원</div></div>`}).join('')}</div>`
  :`<div class="card" style="text-align:center"><div style="width:90px;height:90px;margin:0 auto;border-radius:50%;overflow:hidden">${face()}</div><p>아직 리스트가 없어요.<br>위에서 제목을 적고 만들어 보세요!</p></div>`}`;
  $('#la').onclick=()=>{const t=$('#lt').value.trim();if(!t)return toast('리스트 제목을 적어주세요');
    const l={id:uid(),title:t,items:[]};S.lists.unshift(l);save();cur=l.id;rW()};
  $('#lt').onkeydown=ev=>{if(ev.key==='Enter')$('#la').click()}}
function openList(id){cur=id;photo='';rW()}

// ---- 위시: 리스트 안의 항목 ----
function rItems(){const l=L();
  const names=[...new Set(S.lists.flatMap(x=>x.items.map(i=>i.name)))];
  $('#v').innerHTML=`<div class="row" style="margin-bottom:8px"><button class="g" id="bk">← 리스트 목록</button><span style="flex:1"></span><button class="g" id="ldel">🗑 리스트 삭제</button></div>
  <div class="card"><b>📁 리스트 제목</b><input id="ln" value="${e(l.title)}">
  <b>🎁 사고 싶은 것 추가</b>
  <div class="photo-box" id="pb">${photo?`<img src="${photo}"><div class="sm">눌러서 사진 바꾸기</div>`:'📷 눌러서 사진 첨부하기<br><span class="sm">갤러리나 카메라에서 골라요</span>'}</div>
  <input id="nm" list="nl" placeholder="이름 (이전에 쓴 이름은 자동완성돼요)"><datalist id="nl">${names.map(n=>`<option value="${e(n)}">`).join('')}</datalist>
  <div>${names.slice(0,6).map(n=>`<span class="chip">${e(n)}</span>`).join('')}</div>
  <div class="row"><input id="pr" style="flex:1" inputmode="numeric" placeholder="가격 (원)"><input id="mm" style="flex:1" placeholder="메모(선택)"></div>
  <input id="lk" placeholder="링크(선택)">
  ${photo?'<button class="g" id="px">사진 빼기</button>':''}
  <button id="add" style="width:100%">리스트에 추가</button></div>

// ---- 마이크로 음정 기록 ----
async function startCap(kind){
  const s=S.songs[song];
  if(kind==='m'&&!s.ref)return toast('먼저 ① 원곡 담기를 해주세요');
  const yt=ytOK&&player&&player.seekTo;
  if(!yt&&!manual)return toast('영상이 아직 준비 안 됐어요. 잠깐 뒤에 다시 눌러주세요');
  try{if(!mic)mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(x){return toast('마이크를 쓸 수 없어요. 마이크 권한을 허용해주세요')}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();await actx.resume();
    if(!an){an=actx.createAnalyser();an.fftSize=2048;actx.createMediaStreamSource(mic).connect(an);buf=new Float32Array(an.fftSize)}}
  catch(x){return toast('소리 분석을 시작할 수 없어요')}
  const start=kind==='m'?s.ref.a:A;
  const end=kind==='m'?(s.ref.b>s.ref.a?s.ref.b:s.ref.a+s.ref.len/FPS+1):(B>A?B:0);
  loopOn=false;$('#bl').textContent='🔁 반복 꺼짐';
  if(yt&&kind==='m'&&s.ref)player.setPlaybackRate&&player.setPlaybackRate(s.ref.rate||1);
  if(yt){player.seekTo(start,true);player.playVideo()}else toast(kind==='o'?'지금 유튜브에서 원곡을 틀어주세요 (스피커로)':'지금 유튜브에서 같은 부분을 틀고 불러주세요 (이어폰)');
  capt={kind,p:[],start:yt?start:0,end:yt?end:0,rate:yt?(+$('#sp').value||1):1,maxF:kind==='m'&&s.ref?s.ref.len+5*FPS:MAXS*FPS};
  if(kind==='m'&&window.MediaRecorder){chunks=[];try{mrec=new MediaRecorder(mic);mrec.ondataavailable=ev=>chunks.push(ev.data);mrec.start()}catch(x){mrec=null}}
  $(kind==='o'?'#rO':'#rM').textContent=kind==='o'?'⏹ 원곡 담기 끝':'⏹ 그만 부르기';
  tk=setInterval(()=>{if(!capt)return;an.getFloatTimeDomainData(buf);const f=pitch(buf,actx.sampleRate);
    const m=f?+(69+12*Math.log2(f/440)).toFixed(1):null;capt.p.push(m);
    const lv=$('#live');if(lv)lv.textContent=(capt.kind==='o'?'🎧 원곡 듣는 중 ':'🎤 부르는 중 ')+(m?'🎵 '+note(m):'…')+`  (${(capt.p.length/FPS).toFixed(0)}초)`;
    const t=player&&player.getCurrentTime?player.getCurrentTime():0;
    if((yt&&capt.end&&t>=capt.end)||capt.p.length>=capt.maxF)stopCap()},1000/FPS)}

function stopCap(abort){if(!capt)return;clearInterval(tk);const c=capt;capt=null;try{player&&player.pauseVideo()}catch(x){}
  const r=mrec;mrec=null;if(r){r.onstop=()=>{if(myUrl)URL.revokeObjectURL(myUrl);myUrl=URL.createObjectURL(new Blob(chunks,{type:r.mimeType||'audio/webm'}));const b=$('#pM');if(b)b.style.display='inline-block'};try{r.stop()}catch(x){}}
  const bO=$('#rO'),bM=$('#rM'),lv=$('#live');if(bO)bO.textContent='🎧 원곡 담기 시작';if(bM)bM.textContent='🎤 부르기 시작';if(lv)lv.textContent='';
  if(abort)return;
  const {p,lead}=clean(c.p);
  if(p.filter(v=>v!=null).length<FPS)return toast('소리가 거의 안 잡혔어요. 마이크 가까이에서 다시 해주세요');
  const s=S.songs[song];
  if(c.kind==='o'){s.ref={p,a:c.start,b:c.end,t0:c.start+lead/FPS*c.rate,len:c.p.length,rate:c.rate};save();
    $('#oInfo').textContent=`담긴 원곡: ${mmss(s.ref.t0)}부터 ${(p.length/FPS).toFixed(1)}초`;toast('원곡을 담았어요! 이제 이어폰 끼고 ② 불러보세요')}
  else{last=compare(s.ref,p);show(last)}}

// 음정 찾기 (McLeod 방식 자기상관). 소리가 작거나 애매하면 0
function pitch(b,sr){const W=1024;let rms=0;for(let i=0;i<W;i++)rms+=b[i]*b[i];if(Math.sqrt(rms/W)<0.012)return 0;
  const minL=Math.floor(sr/1000),maxL=Math.min(Math.floor(sr/70),W-2),n=new Float32Array(maxL+2);let mx=0;
  for(let t=minL;t<=maxL+1;t++){let ac=0,m=0;for(let j=0;j<W-t;j++){ac+=b[j]*b[j+t];m+=b[j]*b[j]+b[j+t]*b[j+t]}n[t]=m?2*ac/m:0;if(t<=maxL&&n[t]>mx)mx=n[t]}
  if(mx<0.6)return 0;
  for(let t=minL+1;t<=maxL;t++){if(n[t]>=0.9*mx&&n[t]>=n[t-1]&&n[t]>=n[t+1]){const a=n[t-1],bb=n[t],c=n[t+1],d=a-2*bb+c,sh=d?0.5*(a-c)/d:0;return sr/(t+sh)}}
  return 0}
// 앞뒤 빈 소리 자르고, 튀는 값 정리(중앙값 필터)
function clean(raw){let s=0,e2=raw.length-1;while(s<raw.length&&raw[s]==null)s++;while(e2>s&&raw[e2]==null)e2--;
  const p=raw.slice(s,e2+1).map((v,i,a)=>{if(v==null)return null;const w=a.slice(Math.max(0,i-2),i+3).filter(x=>x!=null);if(w.length<3)return null;w.sort((x,y)=>x-y);return w[w.length>>1]});
  return {p,lead:s}}
const med=arr=>{const s=[...arr].sort((x,y)=>x-y);return s[s.length>>1]};

// 원곡과 내 음정을 시간 맞춰(DTW) 비교
function compare(ref,mine){const R=ref.p;
  const vr=R.filter(v=>v!=null),vm=mine.filter(v=>v!=null);
  const oct=Math.round((med(vm)-med(vr))/12)*12; // 남녀처럼 옥타브 차이는 봐줌
  const M2=mine.map(v=>v==null?null:v-oct),N=R.length,M=M2.length,w=Math.max(Math.abs(N-M)+5,Math.round(Math.max(N,M)*0.2));
  const W=M+1,D=new Float32Array((N+1)*W).fill(Infinity);D[0]=0;
  const cost=(a,b)=>a==null&&b==null?0:(a==null||b==null)?1.5:Math.min(Math.abs(a-b),6);
  for(let i=1;i<=N;i++){const c=Math.round(i*M/N),lo=Math.max(1,c-w),hi=Math.min(M,c+w);
    for(let j=lo;j<=hi;j++){const k=i*W+j;D[k]=cost(R[i-1],M2[j-1])+Math.min(D[k-W],D[k-1],D[k-W-1])}}
  const path=[];let i=N,j=M;
  while(i>0&&j>0){path.push([i-1,j-1]);const a=D[(i-1)*W+j-1],b=D[(i-1)*W+j],c=D[i*W+j-1];if(a<=b&&a<=c){i--;j--}else if(b<=c)i--;else j--}
  path.reverse();
  const al=Array(N).fill(null).map(()=>[]);path.forEach(([x,y])=>{if(M2[y]!=null)al[x].push(M2[y])});
  const mineOn=al.map(a=>a.length?med(a):null);
  let both=0,hit=0,sum=0,cov=0,rv=0,lag=0;
  path.forEach(([x,y])=>{lag+=(y-x*M/N)});
  for(let x=0;x<N;x++){if(R[x]!=null){rv++;if(mineOn[x]!=null){cov++;both++;const d=mineOn[x]-R[x];sum+=d;if(Math.abs(d)<=1)hit++}}}
  const seg=[],K=Math.min(5,Math.max(1,Math.round(N/FPS/4)));
  for(let k=0;k<K;k++){const a=Math.floor(N*k/K),b=Math.floor(N*(k+1)/K);let h=0,t=0,s2=0;
    for(let x=a;x<b;x++)if(R[x]!=null&&mineOn[x]!=null){t++;const d=mineOn[x]-R[x];s2+=d;if(Math.abs(d)<=1)h++}
    seg.push({from:ref.t0+a/FPS*(ref.rate||1),to:ref.t0+b/FPS*(ref.rate||1),acc:t?Math.round(h/t*100):0,bias:t?+(s2/t).toFixed(1):0})}
  const perSec=[];for(let x=0;x<N;x+=FPS){const r=R.slice(x,x+FPS).filter(v=>v!=null),m=mineOn.slice(x,x+FPS).filter(v=>v!=null);
    perSec.push(`${mmss(ref.t0+x/FPS*(ref.rate||1))} 원곡 ${r.length?note(med(r)):'-'} / 나 ${m.length?note(med(m)):'-'}`)}
  const acc=both?Math.round(hit/both*100):0,cover=rv?Math.round(cov/rv*100):0,bias=both?+(sum/both).toFixed(1):0,lagS=+(lag/path.length/FPS).toFixed(2);
  return {R,mineOn,acc,cover,bias,lagS,oct,seg,perSec,score:Math.round(acc*0.65+cover*0.35),range:[note(Math.min(...vm)),note(Math.max(...vm))]}}

function show(r){$('#res').style.display='block';$('#fb').textContent='';
  const tip=r.bias>0.5?`전체적으로 원곡보다 약 ${r.bias}음(반음) <b>높게</b> 불렀어요`:r.bias<-0.5?`전체적으로 원곡보다 약 ${-r.bias}음(반음) <b>낮게</b> 불렀어요`:'전체 음 높이는 원곡과 잘 맞아요';
  const tm=Math.abs(r.lagS)<0.15?'박자는 원곡과 거의 맞아요':r.lagS>0?`평균 ${r.lagS}초 정도 <b>늦게</b>따라갔어요`:`평균 ${-r.lagS}초 정도 <b>빠르게</b>불렀어요`;
  const weak=[...r.seg].sort((a,b)=>a.acc-b.acc)[0];
  $('#sc').innerHTML=`<div class="big" style="font-size:26px">${r.score}점</div>
  <div class="sm">🎯 음정 정확도 ${r.acc}% · 🔊 원곡 따라 부른 비율 ${r.cover}%<br>↕️ ${tip}<br>⏱ ${tm}<br>🎼 내 음역: ${r.range[0]} ~ ${r.range[1]}${r.oct?` (원곡과 ${Math.abs(r.oct/12)}옥타브 차이는 봐줬어요)`:''}<br>
  📍 가장 약한 구간: ${mmss(weak.from)}~${mmss(weak.to)} (${weak.acc}%)<br>※ 마이크로 잡은 음정 기준이라 대략적인 결과예요. 원곡은 반주가 섞여 오차가 있을 수 있어요.</div>`;
  draw(r)}

function draw(r){const cv=$('#cv'),g=cv.getContext('2d'),Wd=cv.width,H=cv.height;g.clearRect(0,0,Wd,H);
  const all=[...r.R,...r.mineOn].filter(v=>v!=null),lo=Math.min(...all)-2,hi=Math.max(...all)+2,N=r.R.length;
  const X=i=>i/(N-1||1)*(Wd-20)+10,Y=v=>H-10-(v-lo)/(hi-lo||1)*(H-20);
  g.strokeStyle='#eee';g.lineWidth=1;for(let v=Math.ceil(lo);v<hi;v++)if(v%12===0){g.beginPath();g.moveTo(0,Y(v));g.lineTo(Wd,Y(v));g.stroke()}
  const line=(arr,col,wd)=>{g.strokeStyle=col;g.lineWidth=wd;g.beginPath();let on=false;arr.forEach((v,i)=>{if(v==null){on=false;return}on?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));on=true});g.stroke()};
  line(r.R,'#bbb',4);line(r.mineOn,getComputedStyle(document.documentElement).getPropertyValue('--c').trim()||'#f2b632',2.5)}

async function coach(s){if(!last)return toast('먼저 ② 노래를 불러주세요');$('#fb').textContent='분석 중… 🐶';const r=last;
  const t=await ai([{type:'text',text:`너는 다정한 노래 연습 코치야. 노래 제목: "${s.title}".
가사와 음원은 없고, 휴대폰 마이크로 잡은 음정 데이터만 있어. 원곡 음정은 스피커 소리를 녹음한 것이라 반주 때문에 틀린 값이 섞였을 수 있어. 옥타브 차이는 이미 맞춰서 비교했어.
[전체] 점수 ${r.score}점, 음정 정확도(반음 이내) ${r.acc}%, 원곡 따라 부른 비율 ${r.cover}%, 평균 음높이 차이 ${r.bias}반음(+는 높게), 평균 박자 차이 ${r.lagS}초(+는 늦게), 내 음역 ${r.range.join('~')}
[구간별] ${r.seg.map(g=>`${mmss(g.from)}~${mmss(g.to)}: 정확도 ${g.acc}%, 음높이차 ${g.bias}`).join(' / ')}
[초 단위 음정] ${r.perSec.join(' | ')}
이 데이터만 근거로, 한국어로 짧고 쉽게: 1) 잘한 점 1가지 2) 고칠 점 3가지(시간 표시와 함께) 3) 오늘 바로 할 연습법 2가지. 데이터에 없는 가사나 내용은 지어내지 마. 전체 350자 이내로 끝까지 완성해서 답해.`}]);
  $('#fb').textContent=t||''}

// ---- 꾸미기 ----
function rD(){const c=S.cfg;
  $('#v').innerHTML=`<div class="card"><b>제목</b><input id="dt" value="${e(c.title)}"><b>말풍선 한마디</b><input id="ds" value="${e(c.say)}">
  <b>포인트 색</b><input id="dc" type="color" value="${c.color}">
  <b>캐릭터 사진</b>
  <div class="row"><div style="width:72px;height:72px;border:3px solid var(--c);border-radius:50%;overflow:hidden;flex:none">${face()}</div>
  <div><button class="g" id="di">다른 사진으로 바꾸기</button>${c.img?'<button class="g" id="dr">🐶 기본 강아지로</button>':''}</div></div></div>
  <div class="card"><b>🔤 폰트 (${FONTS.length}가지)</b>
  <button class="g" id="fbtn" style="width:100%;display:flex;justify-content:space-between;align-items:center"><span id="fcur"></span><span id="farr">▼ 펼치기</span></button>
  <div class="fonts" id="fgrid" style="display:none">${FONTS.map(([sp,kn])=>{const f=fam(sp);return `<div class="fo ${f===c.font?'on':''}" data-f="${e(f)}"><div class="s" style="font-family:'${e(f)}',sans-serif">${SAMPLE.split(' ').slice(0,2).join(' ')}</div><div class="n">${e(kn)}</div></div>`}).join('')}</div></div>
  <div class="card"><b>🤖 AI 키 (선택)</b><p class="sm">노래연습의 AI 코치에만 쓰여요(사용량만큼 요금 발생). 키는 이 폰 안에만 저장되고, 저장한 뒤에는 화면에 다시 보이지 않아요.</p><div id="kbox"></div></div>`;
  const on=(id,k)=>$(id).oninput=ev=>{S.cfg[k]=ev.target.value;save();skin()};
  on('#dt','title');on('#ds','say');on('#dc','color');kbox();
  // 폰트 미리보기: 샘플 글자만 담은 가벼운 요청 한 번으로 전부 불러오기
  if(!$('#fpv')){const l=document.createElement('link');l.id='fpv';l.rel='stylesheet';l.href=fUrl(FONTS.map(f=>f[0]),'가나다위시');document.head.appendChild(l)}
  // 폰트 목록: 버튼으로 펼치고, 하나 고르면 자동으로 접힘
  const fName=()=>{const f=FONTS.find(x=>fam(x[0])===S.cfg.font);return f?f[1]:S.cfg.font};
  const fShow=open=>{$('#fgrid').style.display=open?'grid':'none';$('#farr').textContent=open?'▲ 접기':'▼ 펼치기';
    $('#fcur').innerHTML=`지금 폰트: <b style="font-family:'${e(S.cfg.font)}',sans-serif">${e(fName())}</b>`};
  fShow(false);
  $('#fbtn').onclick=()=>fShow($('#fgrid').style.display==='none');
  document.querySelectorAll('.fo').forEach(d=>d.onclick=()=>{S.cfg.font=d.dataset.f;save();skin();document.querySelectorAll('.fo').forEach(x=>x.classList.toggle('on',x===d));fShow(false);toast(fName()+' 폰트로 바꿨어요');$('#fbtn').scrollIntoView({behavior:'smooth',block:'center'})});
  $('#di').onclick=()=>pick(d=>{S.cfg.img=d;save();render()},240);
  if($('#dr'))$('#dr').onclick=()=>{S.cfg.img='';save();render()}}
// AI 키: 한 번 저장하면 숨김 (값을 화면에 다시 채우지 않음)
function kbox(edit){const b=$('#kbox');if(!b)return;
  if(S.cfg.key&&!edit){b.innerHTML=`<div class="row"><span style="flex:1">✅ AI 키가 저장되어 있어요</span><button class="g" id="kc">키 바꾸기</button><button class="g" id="kd">키 지우기</button></div>`;
    $('#kc').onclick=()=>kbox(true);
    $('#kd').onclick=async()=>{if(await ask('저장된 AI 키를 지울까요?')){S.cfg.key='';save();kbox();toast('AI 키를 지웠어요')}};return}
  b.innerHTML=`<input id="dk" type="password" autocomplete="off" placeholder="sk-ant-... 붙여넣기"><div class="row"><button id="ks">저장</button>${S.cfg.key?'<button class="g" id="kx">취소</button>':''}</div>`;
  $('#ks').onclick=()=>{const v=$('#dk').value.trim();if(!v)return toast('키를 붙여넣어 주세요');if(!/^sk-/.test(v))return toast('키는 보통 sk- 로 시작해요. 다시 확인해주세요');
    S.cfg.key=v;save();$('#dk').value='';kbox();toast('AI 키를 저장했어요. 이제 화면에는 안 보여요')};
  if($('#kx'))$('#kx').onclick=()=>kbox();
}
// ---- 백업 · 복구 · 초기화 (모든 탭 맨 아래) ----
$('#bkup').onclick=()=>{try{
  const data={app:'wiserest',ver:2,date:new Date().toISOString(),lists:S.lists,songs:S.songs,cfg:{...S.cfg,key:''}};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='wiserest.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);toast('wiserest.json 백업 파일을 만들었어요 (다운로드 폴더 확인)')}
  catch(x){toast('백업 파일을 만들 수 없어요')}};
$('#rstr').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{let d;try{d=JSON.parse(r.result)}catch(x){return toast('백업 파일을 읽을 수 없어요')}
      if(!d||!Array.isArray(d.lists))return toast('wiserest 백업 파일이 아니에요');
      const n=d.lists.reduce((a,l)=>a+(l.items||[]).length,0);
      if(!await ask(`백업(${d.date?new Date(d.date).toLocaleString('ko-KR'):'날짜 모름'})으로 복구할까요?\n리스트 ${d.lists.length}개 · 물건 ${n}개 · 노래 ${(d.songs||[]).length}곡\n지금 데이터는 이걸로 바뀌어요.`))return;
      stopAll();S={lists:d.lists.map(l=>({id:l.id||uid(),title:l.title||'제목 없음',items:Array.isArray(l.items)?l.items:[]})),songs:Array.isArray(d.songs)?d.songs:[],cfg:{...DEF_CFG,...(d.cfg||{}),key:S.cfg.key}};
      migrate();cur=null;photo='';save();render();toast('복구했어요!')};
    r.readAsText(f)};i.click()};
$('#rset').onclick=async()=>{
  if(!await ask('정말 초기화할까요? 위시리스트·사진·노래·꾸미기·AI 키가 모두 지워져요.'))return;
  if(!await ask('되돌릴 수 없어요. 먼저 백업하셨나요? 정말 지울까요?'))return;
  stopAll();S={lists:[],songs:[],cfg:{...DEF_CFG}};cur=null;photo='';save();tab='w';render();toast('처음 상태로 초기화했어요')};
// ---- 휴대폰 설치 (PWA) ----
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let instEv=null;
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();instEv=ev;if(!standalone)$('#inst').style.display='block'});
window.addEventListener('appinstalled',()=>{$('#inst').style.display='none';toast('설치 완료! 홈 화면에서 wiserest를 열어보세요')});
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)){ // 아이폰은 자동 설치 창이 없어서 방법 안내
  $('#inst').style.display='block';$('#insttx').innerHTML='사파리 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 눌러주세요.';$('#instb').style.display='none'}
$('#instb').onclick=async()=>{if(!instEv)return toast('크롬 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"를 눌러주세요');
  instEv.prompt();const r=await instEv.userChoice;instEv=null;if(r.outcome==='accepted')$('#inst').style.display='none'};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
